      <text x="30" y="498" class="small">Gearbox to the lower link end 5.6 mm · to the pivot hardware 9.1 mm · to the upper link end 24.82 mm</text>
      <text x="30" y="516" class="small">Nearest link clearance in 15–45°: 5.6 mm at 15° · floor to the motor body 31.6 mm · axle 80 mm behind the body pivot</text>
