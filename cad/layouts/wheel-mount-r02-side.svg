<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="jd3-side-title jd3-side-desc" class="jd side-sheet">
      <title id="jd3-side-title">JD-03 side view at 30 degrees, axle rearward of the lower pivot by 25 millimetres</title>
      <desc id="jd3-side-desc">The carrier plate carries the two link pivots 40 millimetres apart and the Pololu 4752 gearmotor. The axle is 25 millimetres from the lower pivot. The gearbox axis is 7 millimetres further from the pivots. The nearest clearance between the gearbox and a link end is 5.6 millimetres at 15 degrees. Ground clearance under the motor is 31.6 millimetres.</desc>
