      <text x="8" y="16" font-family="system-ui,sans-serif" font-size="3" fill="#5c6c63">Design proposal. Pivots 40 mm apart. Axle 25 mm rearward of the lower pivot. Gearbox axis 7 mm further from the pivots.</text>
      <text x="8" y="21" font-family="system-ui,sans-serif" font-size="3" fill="#5c6c63">Holes: 2 × Ø4.5 pivots, Ø12.4 pilot, 6 × Ø3.4 on Ø31 with Ø6.5 × 4.0 counterbores on the wheel side.</text>
      <text x="8" y="26" font-family="system-ui,sans-serif" font-size="3" fill="#5c6c63">Right carrier, wheel side toward you. Mirror it for the left leg.</text>
