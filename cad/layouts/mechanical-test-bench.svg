      <circle cx="240" cy="141" r="14.8" fill="#b57a41"/><circle cx="240" cy="141" r="4.2" fill="#fffefa" stroke="#203830" stroke-width="1.2"/><circle cx="240" cy="215" r="14.8" fill="#357457"/><circle cx="240" cy="215" r="4.2" fill="#fffefa" stroke="#203830" stroke-width="1.2"/><circle cx="341.75" cy="317.24" r="14.8" fill="#b57a41"/><circle cx="341.75" cy="317.24" r="4.2" fill="#fffefa" stroke="#203830" stroke-width="1.2"/><circle cx="341.75" cy="391.24" r="14.8" fill="#357457"/><circle cx="341.75" cy="391.24" r="4.2" fill="#fffefa" stroke="#203830" stroke-width="1.2"/>
      <path d="M166 141H137M166 215H137" class="leader"/><path d="M145 141V215" class="dim"/><text x="83" y="183" class="label">40 mm</text>
