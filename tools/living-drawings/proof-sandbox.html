        </div>
        <aside class="budget-note">
          <h3>What this is and is not</h3>
          <ul class="sbx-notes">
            <li><b>Same plant and controller.</b> The page loads <code>tools/v1-proof/sim.js</code> itself: Rapier rigid bodies at 1 kHz, encoder-quantized odometry, delayed noisy attitude and the 500 Hz discrete LQR. It also includes voltage- and speed-limited motor torque, drive lag, deadband and optional backlash.</li>
            <li><b>Fixtures.</b> The lanes are the fixtures of the physical protocol: 3° grade, 3° cross-slope, 5 mm bump (both wheels and one wheel), 3 mm seam, plus the 20 mm threshold the study records as a failure. Fixture ramps have kinks and transitions. The study tilted the whole floor.</li>
            <li><b>Leg height is a preview.</b> Pinned 15°, 30° and 45° poses were in the study and pass. A move between them re-places the CoM and the pitch trim at 10°/s. The leg inertia, the servo torque and its reaction on the body are not modeled. Powered height motion is unvalidated.</li>
            <li><b>Size.</b> Body, links, wheels and motors are drawn from <code>model.json</code> envelopes: 120 × 110 × 150 mm body, 110 mm links, 100 mm wheels at 230 mm track. Packaging, belts and wiring are not detailed. The dashed box is the parked STAIR-V1 envelope for scale.</li>
            <li><b>Not modeled.</b> Raw IMU fusion, firmware timing, thermal limits, tire compliance, regeneration, servo dynamics. A good run here is a candidate for a bench test, not evidence the robot works.</li>
          </ul>
          <p class="small">Headless check: <code>node tools/v1-proof/test_sandbox.js</code>. Saved evidence: <a href="proof-simulation.html">Simulations</a>.</p>
        </aside>

      <article class="card">
        <h2>What this is and is not</h2>
        <ul class="sim-notes">
          <li><b>Physics.</b> Rapier rigid bodies at 2 kHz: body, two hip yokes, four carbon tubes, two wheels, Coulomb friction, real contacts with the stair, sills and crates.</li>
          <li><b>Motors.</b> Every joint has torque-speed limits and a first-order response, updated at 2 kHz. Joint stops and nonadjacent self-collisions are enabled. The in-wheel motors lose torque linearly to the assumed no-load speed. Parking requires the support skid; without it the request stops motion while keeping balance active. Emergency motor-off remains separate.</li>
          <li><b>Suspension.</b> Each leg is a virtual spring-damper along the hip-to-axle line (3.5 Hz, 0.6 damping by default) with the leg angle held stiff. A real Hux can only do this with torque-controlled, backdrivable joints (FOC / QDD class) or real springs. A position servo or a stepper cannot.</li>
          <li><b>Reflexes.</b> A leg that is hit hard at speed hops its wheel up for about a tenth of a second. A wheel stopped dead by an edge at walking pace hops too. When the mass runs away, the legs swing and the hip rolls step the wheels under it. The current implementation uses ideal simulated state.</li>
          <li><b>One wheel.</b> Left/right buttons request a planned sequence: stand tall, stiffen, shift the mass over the planted wheel until the other carries about 15%, hold, then centre. The HUD reports actual support, requiring both low free-wheel load and ground clearance before reporting single support. With a hop time set, the free wheel comes up for that long with the hip rolls held stiff (no one-wheel balance), the robot tips toward the free side, and the wheel goes back down: dynamic single support, what a stair step needs. The balanced one-wheel stand is an acrobot with a few millimetres of capture region on this geometry and stays experimental — <code>docs/research/one-leg-stance.md</code>.</li>
          <li><b>Balance.</b> LQR on the lean of the mass over the axle, rebuilt as the legs change height, at 500 Hz. Roll levelling by leg length and leg force. It uses delayed ideal state and contact samples. A physical state and load estimator remains to be implemented.</li>
          <li><b>Tire.</b> One shared profile (<code>tire.js</code>): a 6″ × 1.25″ tread with a full-round crown, the shape a scooter pneumatic takes on a narrow rim. The collision hull, the mesh and the 2D projection all come from it, so the contact point walks around the crown as the wheel cambers instead of catching an edge. Each tire is a tread ring on a carcass spring (stiffness and damping are knobs; 40 kN/m is a guess for a high-pressure 6×1.25, not a measurement), so the wheel squishes and shifts sideways on the hub and the HUD reports the pad that deflection implies. Rapier still resolves the contact at points; the pad is an estimate, not a resolved patch. The ring's rolling error is measured separately.</li>
          <li><b>Not modelled.</b> Motor inertia through the gearbox, backlash, belt stretch, tube flex, battery sag, current limits, temperature and sensor noise. Delay and drive response are adjustable assumptions, not measured hardware. No stair-climb controller yet: the stair is there to drive up to.</li>
        </ul>
        <p class="hint">Findings and how to rerun them: <code>docs/research/sim-sandbox.md</code>. Headless check: <code>node tools/living-drawings/sim-test.js</code>.</p>
      </article>
